<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الاستعلام عن درجة اختبار الوحدة الثانية</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Noto Naskh Arabic',serif;font-weight:700;background:linear-gradient(180deg,#e8f1ff,#f6f9ff);color:#0b2a5b;min-height:100vh}
.w{max-width:560px;margin:0 auto;padding:16px}
.h{background:linear-gradient(135deg,#0b3d91,#1e66d0);color:#fff;border-radius:22px;padding:22px 16px;text-align:center;box-shadow:0 8px 22px #0b3d9133}
.h small{display:block;font-size:19px;opacity:.9}.h big{display:block;font-size:30px;line-height:1.6;margin-top:4px}
.c{background:#fff;border:2px solid #cfe0fb;border-radius:20px;padding:20px;margin-top:16px;box-shadow:0 4px 14px #0b3d9114}
label{display:block;font-size:21px;line-height:1.8;margin-bottom:10px}
input{width:100%;font:inherit;font-size:24px;padding:14px;border:3px solid #9fc0f5;background:#f2f7ff;color:#0b2a5b;border-radius:14px;text-align:center;outline:0}
input:focus{border-color:#1e66d0;background:#fff}
button{width:100%;margin-top:14px;font:inherit;font-size:26px;padding:14px;background:#1e66d0;color:#fff;border:0;border-radius:14px;box-shadow:0 4px 0 #0b3d91}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #0b3d91}
.r{margin-top:16px;background:#eaf2ff;border:2px solid #b9d3fa;border-radius:18px;padding:16px;text-align:center;font-size:22px;line-height:1.9}
.r b{display:inline-block;margin-top:6px;background:#0b3d91;color:#fff;border-radius:14px;padding:4px 26px;font-size:40px}
.e{background:#fff1f1;border-color:#f2b8b8;color:#a30015}
.s{text-align:center;font-size:19px;margin-top:18px;color:#0b3d91}
</style></head><body><div class="w">
<div class="h"><small>ابتدائية القادسية — الدراسات الاجتماعية</small><big>الاستعلام عن درجة اختبار الوحدة الثانية</big></div>
<div class="c">
<label>اكتب رقم السجل المدني للطالب (١٠ أرقام):</label>
<input id="q" autocomplete="off" inputmode="numeric" maxlength="10"><button id="b">استعلام</button>
<div id="o"></div>
</div></div>
<script>
var EP='https://script.google.com/macros/s/AKfycby60are3UKEjF65UpHtvBPn8ykBjJrkoG_4mTDS_Vgs19nLrRqgPnpP2W2BCA18D0MW/exec';
function dig(s){return String(s).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)})}
function ar(n){return String(n).replace(/[0-9]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d]})}
function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}
document.getElementById('b').onclick=function(){
 var q=dig(document.getElementById('q').value).trim(),o=document.getElementById('o');
 if(!/^[0-9]{10}$/.test(q)){o.innerHTML='<div class="r e">اكتب رقم السجل المدني كاملًا (١٠ أرقام)</div>';return}
 o.innerHTML='<div class="r">جارٍ البحث...</div>';
 fetch(EP+'?action=result&q='+encodeURIComponent(q)).then(function(r){return r.json()}).then(function(j){
  if(!j.ok){o.innerHTML='<div class="r e">لم يتم العثور على نتيجة. تأكد من الرقم، أو تواصل مع المعلم.</div>';return}
  o.innerHTML=j.list.map(function(x){return '<div class="r">الصف '+esc(x.exam)+' — فصل '+esc(x.section)+'<br>الدرجة<br><b>'+ar(x.score)+' من '+ar(x.total)+'</b></div>'}).join('')
 }).catch(function(){o.innerHTML='<div class="r e">تعذر الاتصال، حاول مرة أخرى.</div>'})};
document.getElementById('q').onkeydown=function(e){if(e.key==='Enter')document.getElementById('b').click()};
</script></body></html>
