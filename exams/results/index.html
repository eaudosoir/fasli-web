<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الاستعلام عن درجة اختبار الوحدة الثانية</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-size:24px;font-family:'Amiri','Noto Naskh Arabic',serif;font-weight:700;background:#f0f9ff;color:#0c3a57;min-height:100vh}
.w{max-width:560px;margin:0 auto;padding:16px}
.h{background:#0369a1;color:#fff;border-radius:18px 18px 0 0;padding:22px 16px;text-align:center}
.h small{display:block;font-size:21px;opacity:.9}.h big{display:block;font-size:30px;line-height:1.7;margin-top:4px}
.bar{height:6px;background:#38bdf8}
.c{background:#fff;border:3px solid #e0f2fe;border-top:0;border-radius:0 0 18px 18px;padding:20px}
label{display:block;font-size:22px;line-height:1.9;margin-bottom:10px}
input{width:100%;font:inherit;font-size:27px;padding:12px;border:3px solid #e0f2fe;background:#f0f9ff;color:#0c3a57;border-radius:12px;text-align:center;outline:0}
input:focus{border-color:#0369a1;background:#fff}
button{width:100%;margin-top:14px;font:inherit;font-size:26px;padding:12px;background:#0369a1;color:#fff;border:0;border-radius:12px}
button:active{opacity:.85}
.r{margin-top:16px;background:#e0f2fe;border-radius:14px;padding:16px;text-align:center;font-size:24px;line-height:1.9}
.r b{display:inline-block;margin-top:6px;background:#0369a1;color:#fff;border-radius:12px;padding:2px 26px;font-size:43px}
.e{background:#fdeeee;color:#a30015}
.s{text-align:center;font-size:19px;margin-top:18px;color:#0369a1}
</style></head><body><div class="w">
<div class="h"><small>ابتدائية القادسية — الدراسات الاجتماعية</small><big>الاستعلام عن درجة اختبار الوحدة الثانية</big></div>
<div class="bar"></div><div class="c">
<label>اكتب اسم الطالب (ثلاثة أسماء على الأقل) أو رقم السجل المدني:</label>
<input id="q" autocomplete="off" maxlength="60" placeholder="الاسم أو رقم السجل المدني"><button id="b">استعلام</button>
<div id="o"></div>
</div></div>
<script>
var EP='https://script.google.com/macros/s/AKfycby60are3UKEjF65UpHtvBPn8ykBjJrkoG_4mTDS_Vgs19nLrRqgPnpP2W2BCA18D0MW/exec';
function dig(s){return String(s).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)})}
function ar(n){return String(n).replace(/[0-9]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d]})}
function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}
document.getElementById('b').onclick=function(){
 var q=dig(document.getElementById('q').value).trim(),o=document.getElementById('o');
 var isId=/^[0-9]{10}$/.test(q);if(!isId&&q.split(/\s+/).filter(Boolean).length<3){o.innerHTML='<div class="r e">اكتب الاسم ثلاثيًا على الأقل كما كتبته في الاختبار، أو رقم السجل المدني كاملًا (١٠ أرقام)</div>';return}
 o.innerHTML='<div class="r">جارٍ البحث...</div>';
 fetch(EP+'?action=result&q='+encodeURIComponent(q)).then(function(r){return r.json()}).then(function(j){
  if(!j.ok){o.innerHTML='<div class="r e">لم يتم العثور على نتيجة. تأكد من كتابة الاسم كما كتبته في الاختبار، أو استخدم رقم السجل، أو تواصل مع المعلم.</div>';return}
  o.innerHTML=j.list.map(function(x){return '<div class="r">الصف '+esc(x.exam)+' — فصل '+esc(x.section)+'<br>الدرجة<br><b>'+ar(x.score)+' من '+ar(x.total)+'</b></div>'}).join('')
 }).catch(function(){o.innerHTML='<div class="r e">تعذر الاتصال، حاول مرة أخرى.</div>'})};
document.getElementById('q').onkeydown=function(e){if(e.key==='Enter')document.getElementById('b').click()};
</script></body></html>
