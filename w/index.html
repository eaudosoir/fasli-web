<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ورقة عمل — الدراسات الاجتماعية</title>
<style>
@font-face { font-family: N; src: url(naskh.ttf) format('truetype'); font-weight: 400 800; font-display: swap; }
:root { --pri: #1E5E4E; --pri2: #2A9078; --ink: #1F2A37; --mut: #6B7280; --line: #DCE7E3; --bg: #F3F7F6; --ok: #1F8A4C; --bad: #C0392B; --pur: #5B4A8B; }
* { box-sizing: border-box; }
body { margin: 0; font-family: N, 'Noto Naskh Arabic', serif; font-weight: 700; color: var(--ink); background: var(--bg); line-height: 1.8; }
.wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
.band { background: linear-gradient(135deg, var(--pri2), var(--pri)); color: #fff; border-radius: 18px; padding: 18px 18px 16px; text-align: center; }
.band h1 { margin: 0; font-size: 1.45rem; line-height: 1.6; }
.band p { margin: 4px 0 0; opacity: .92; font-size: .98rem; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 14px; }
.lbl { display: block; color: var(--mut); font-size: .95rem; margin-bottom: 6px; }
select, button { font: inherit; }
select { width: 100%; padding: 12px; border: 2px solid var(--line); border-radius: 12px; background: #fff; font-size: 1.05rem; }
.q { margin-top: 14px; }
.q h3 { margin: 0 0 8px; font-size: 1.08rem; line-height: 1.8; }
.q h3 span { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--pur); color: #fff; font-size: .9rem; margin-left: 6px; }
.opt { display: flex; align-items: center; gap: 10px; width: 100%; text-align: right; padding: 11px 14px; margin-top: 7px; border: 2px solid var(--line); border-radius: 12px; background: #fff; cursor: pointer; font-size: 1.02rem; color: var(--ink); }
.opt i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #B8C6C1; flex: none; }
.opt.on { border-color: var(--pri2); background: #EEF7F4; } .opt.on i { border: 6px solid var(--pri2); }
.opt.right { border-color: var(--ok); background: #EAF6EE; } .opt.wrong { border-color: var(--bad); background: #FCEDEB; }
.opt .tag { margin-right: auto; font-size: .85rem; }
.btn { display: block; width: 100%; margin-top: 16px; padding: 14px; border: 0; border-radius: 14px; background: var(--pri); color: #fff; font-size: 1.1rem; cursor: pointer; }
.btn.wa { background: #1FA855; } .btn[disabled] { opacity: .5; }
.score { text-align: center; font-size: 2.4rem; color: var(--pri); margin: 4px 0; }
.center { text-align: center; } .muted { color: var(--mut); font-weight: 400; } .small { font-size: .92rem; }
.lock { text-align: center; padding: 26px 16px; }
.lock b { display: block; font-size: 1.25rem; margin-bottom: 6px; }
.big-ic { font-size: 2.6rem; color: var(--pri); }
.err { color: var(--bad); }
</style>
<script src="../js/sync-config.js"></script>
</head>
<body>
<div class="wrap" id="app"><p class="center muted">جارٍ التحميل…</p></div>
<script>
'use strict';
const C = Object.assign({ fsBase: 'https://firestore.googleapis.com' }, window.FASLI_SYNC || {});
const BASE = `${C.fsBase}/v1/projects/${C.projectId}/databases/(default)/documents`;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ar = s => String(s).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const iid = (new URLSearchParams(location.search).get('i') || '').replace(/[^A-Za-z0-9]/g, '');
const LSK = 'wsdone_' + iid;
const ls = { get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
const dec = s => { try { return JSON.parse(decodeURIComponent(escape(atob(String(s).split('').reverse().join(''))))); } catch (e) { return []; } };
const app = $('#app');
let W = null, until = null;

const head = () => `<div class="band"><h1>ورقة عمل: ${esc(W.title)}</h1><p>الدراسات الاجتماعية · ${esc(W.cls)}</p></div>`;
const waUrl = (r) => {
  const t = `حل ورقة العمل\nالدرس: ${W.title}\nالطالب: ${r.name}\nالفصل: ${W.cls}\nالدرجة: ${ar(r.score)} من ${ar(r.max)}\nرمز الورقة: ${W.code}`;
  return `https://wa.me/${W.phone || ''}?text=${encodeURIComponent(t)}`;
};
function locked(r, msg) {
  app.innerHTML = head() + `<div class="card lock"><div class="big-ic">✓</div><b>${esc(msg || 'تم إرسال الحل')}</b>
    ${r ? `<p class="muted">الطالب: ${esc(r.name)}<br>الدرجة: ${ar(r.score)} من ${ar(r.max)}</p>` : ''}
    <p class="muted small">الرابط مقفل، ولا يمكن الحل مرة أخرى.</p>
    ${r ? `<a class="btn wa" href="${waUrl(r)}" style="text-decoration:none">إرسال النتيجة للمعلم عبر واتساب</a>` : ''}</div>`;
}
function closed() {
  app.innerHTML = head() + `<div class="card lock"><b>انتهى وقت حل ورقة العمل</b><p class="muted">أُغلق الرابط.</p></div>`;
}

async function load() {
  if (!iid || !C.projectId) { app.innerHTML = '<div class="card lock"><b class="err">الرابط غير صحيح</b></div>'; return; }
  let j;
  try {
    const r = await fetch(`${BASE}/wsi/${iid}?key=${C.apiKey}`);
    if (r.status === 404) { app.innerHTML = '<div class="card lock"><b class="err">الرابط غير صحيح أو حُذفت ورقة العمل</b></div>'; return; }
    j = await r.json();
    if (!r.ok) throw new Error();
  } catch (e) { app.innerHTML = '<div class="card lock"><b class="err">تعذر التحميل، تأكد من الإنترنت ثم أعد فتح الرابط</b></div>'; return; }
  W = JSON.parse(j.fields.data.stringValue); until = new Date(j.fields.until.timestampValue);
  const done = ls.get(LSK);
  if (done) return locked(done);
  if (Date.now() >= until) return closed();
  pick();
}

function pick() {
  app.innerHTML = head() + `<div class="card"><label class="lbl">اختر اسم الطالب</label>
    <select id="who"><option value="">— اسم الطالب —</option>${W.names.map(([k, n]) => `<option value="${esc(k)}">${esc(n)}</option>`).join('')}</select>
    <p class="muted small">${ar(W.qs.length)} أسئلة · تُغلق ورقة العمل ${esc(W.untilText || '')}. يُرسل الحل مرة واحدة فقط.</p>
    <button class="btn" id="go" disabled>ابدأ الحل</button></div>`;
  const sel = $('#who'), go = $('#go');
  sel.onchange = () => go.disabled = !sel.value;
  go.onclick = async () => {
    go.disabled = true; go.textContent = 'لحظة…';
    const k = sel.value, name = W.names.find(x => x[0] === k)[1];
    try {
      const r = await fetch(`${BASE}/wss/${iid}_${k}?key=${C.apiKey}`);
      if (r.ok) { const f = (await r.json()).fields; const d = { name, score: +f.score.integerValue, max: +f.max.integerValue }; ls.set(LSK, d); return locked(d, 'سبق إرسال حل هذا الطالب'); }
    } catch (e) { }
    solve(k, name);
  };
}

function solve(k, name) {
  const ans = W.qs.map(() => null);
  app.innerHTML = head() + `<div class="card"><p class="muted small" style="margin:0">الطالب: <b style="color:var(--ink)">${esc(name)}</b></p>
    ${W.qs.map((q, i) => `<div class="q" data-q="${i}"><h3><span>${ar(i + 1)}</span>${esc(q.q)}</h3>
      ${q.o.map((o, j) => `<button class="opt" data-o="${j}"><i></i>${esc(o)}</button>`).join('')}</div>`).join('')}
    <p class="muted small center" id="left"></p>
    <button class="btn" id="send" disabled>إرسال الحل</button></div>`;
  const left = $('#left'), send = $('#send');
  const upd = () => { const n = ans.filter(a => a === null).length; left.textContent = n ? `باقي ${ar(n)} ${n === 1 ? 'سؤال' : 'أسئلة'}` : 'أجبت عن كل الأسئلة'; send.disabled = !!n; };
  upd();
  app.querySelectorAll('.q').forEach(qe => qe.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    qe.querySelectorAll('.opt').forEach(x => x.classList.remove('on')); b.classList.add('on'); ans[+qe.dataset.q] = +b.dataset.o; upd();
  }));
  send.onclick = async () => {
    if (!confirmBox()) return;
    send.disabled = true; send.textContent = 'جارٍ الإرسال…';
    const key = dec(W.key), score = ans.reduce((a, x, i) => a + (x === key[i] ? 1 : 0), 0), max = W.qs.length;
    const body = { fields: { iid: { stringValue: iid }, k: { stringValue: k }, name: { stringValue: name }, score: { integerValue: String(score) }, max: { integerValue: String(max) }, ans: { stringValue: JSON.stringify(ans) } } };
    let r;
    try { r = await fetch(`${BASE}/wss?documentId=${iid}_${k}&key=${C.apiKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
    catch (e) { send.disabled = false; send.textContent = 'إرسال الحل'; alertBox('تعذر الإرسال، تأكد من الإنترنت ثم اضغط «إرسال الحل» مرة أخرى'); return; }
    if (!r.ok) { // موجود مسبقًا (من جهاز آخر) أو انتهى الوقت
      try { const g = await fetch(`${BASE}/wss/${iid}_${k}?key=${C.apiKey}`); if (g.ok) { const f = (await g.json()).fields; const d = { name, score: +f.score.integerValue, max: +f.max.integerValue }; ls.set(LSK, d); return locked(d, 'سبق إرسال حل هذا الطالب'); } } catch (e) { }
    }
    if (!r.ok) { if (Date.now() >= until) return closed(); send.disabled = false; send.textContent = 'إرسال الحل'; alertBox('تعذر الإرسال، حاول مرة أخرى'); return; }
    const d = { name, score, max }; ls.set(LSK, d);
    review(d, ans, key);
  };
}
let confirmed = false;
function confirmBox() { if (confirmed) return true; confirmed = true; const s = $('#send'); s.textContent = 'تأكيد الإرسال (لا يمكن التعديل بعده)'; return false; }
function alertBox(t) { let p = $('#msg'); if (!p) { $('#send').insertAdjacentHTML('beforebegin', '<p id="msg" class="err center small"></p>'); p = $('#msg'); } p.textContent = t; }

function review(d, ans, key) {
  app.innerHTML = head() + `<div class="card center"><p class="muted" style="margin:0">تم إرسال الحل · ${esc(d.name)}</p>
    <div class="score">${ar(d.score)} / ${ar(d.max)}</div>
    <a class="btn wa" href="${waUrl(d)}" style="text-decoration:none">إرسال النتيجة للمعلم عبر واتساب</a></div>
    <div class="card"><b>الإجابات الصحيحة</b>
    ${W.qs.map((q, i) => `<div class="q"><h3><span>${ar(i + 1)}</span>${esc(q.q)}</h3>
      ${q.o.map((o, j) => `<div class="opt ${j === key[i] ? 'right' : j === ans[i] ? 'wrong' : ''}"><i></i>${esc(o)}${j === key[i] ? '<span class="tag">الإجابة الصحيحة</span>' : j === ans[i] ? '<span class="tag">إجابتك</span>' : ''}</div>`).join('')}</div>`).join('')}
    <p class="muted small center">الرابط مقفل الآن، ولا يمكن الحل مرة أخرى.</p></div>`;
}
load();
</script>
</body>
</html>
