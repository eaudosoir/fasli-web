:root{--bg:#eef4fc;--card:#e1ecfb;--card2:#f6f9fe;--ink:#12304f;--sub:#3d5a7a;--pri:#1f5fbf;--on:#fff;--line:#b9d0ee;--ok:#12794f;--okbg:#dff4ea;--bad:#b4341f;--badbg:#fde8e3;--sig1:#0F8B8D;--sig2:#1F6F96;--siglb:#2D5961;--sigdv:#8CC9C4;--sigrule:#2A9D9A}
@media(prefers-color-scheme:dark){:root{--bg:#0d1829;--card:#15263e;--card2:#101f35;--ink:#e8f0fb;--sub:#a9bfd9;--pri:#6ea8ff;--on:#0b1730;--line:#2a4468;--ok:#58d6a0;--okbg:#10382b;--bad:#ff9a86;--badbg:#3d1f1a;--sig1:#7FF0DD;--sig2:#9CCBFF;--siglb:#D5F1EC;--sigdv:#5FB8B0;--sigrule:#5FB8B0}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'NaskhB','Noto Naskh Arabic',serif;font-weight:700;background:var(--bg);color:var(--ink);line-height:1.75;font-size:clamp(19px,2.3vw,25px);-webkit-text-size-adjust:100%}
.wrap{max-width:1000px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:16px 16px 10px}
.top{display:flex;align-items:center;gap:12px;padding:4px 2px 10px}
.top img{width:56px;height:auto}
.top .t1{font-size:.8em;color:var(--sub);line-height:1.4}
.top .t2{font-size:.95em;line-height:1.4}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:6px 0 16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:clamp(18px,3.4vw,34px)}
h1{font-size:1.75em;line-height:1.4;margin-bottom:8px}
.lead{color:var(--sub);margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 18px}
.chip{background:var(--card2);border:2px solid var(--line);border-radius:999px;padding:4px 16px;font-size:.85em}
label{display:block;margin-bottom:4px;color:var(--sub);font-size:.85em}
input[type=text]{width:100%;font:inherit;border:2px solid var(--line);background:var(--card2);color:var(--ink);border-radius:14px;padding:10px 14px;min-height:52px;margin-bottom:18px}
input:focus-visible,button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.btn{font:inherit;cursor:pointer;border:0;background:var(--pri);color:var(--on);border-radius:16px;padding:12px 28px;min-height:54px;font-size:1.02em;transition:transform .12s}
.btn:hover{transform:translateY(-2px)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--pri);border:2px solid var(--pri)}
.prog{display:flex;align-items:center;gap:12px;margin-bottom:14px;color:var(--sub);font-size:.85em}
.bar{flex:1;height:12px;border-radius:99px;background:var(--card);border:2px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .35s}
.q{font-size:1.32em;line-height:1.65;margin-bottom:16px}
.opts{display:grid;gap:12px}
.opt{font:inherit;text-align:right;cursor:pointer;background:var(--card2);color:var(--ink);border:2.5px solid var(--line);border-radius:16px;padding:12px 18px;min-height:58px;transition:transform .12s,border-color .12s}
.opt:hover:not([disabled]){border-color:var(--pri);transform:translateX(-3px)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt[disabled]{cursor:default}
.tfgrid{grid-template-columns:1fr 1fr}
.tfgrid .opt{text-align:center;font-size:1.15em}
.row{background:var(--card2);border:2.5px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:12px}
.row .x{margin-bottom:6px}
.row .cs{display:flex;flex-wrap:wrap;gap:8px}
.cb{font:inherit;cursor:pointer;background:transparent;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:6px 14px;min-height:46px}
.cb.sel{background:var(--pri);color:var(--on);border-color:var(--pri)}
.cb.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.cb.bad{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.row.ok{border-color:var(--ok)}.row.bad{border-color:var(--bad)}
.row .why{display:none;margin-top:8px;font-size:.88em;color:var(--sub)}
.row.bad .why{display:block}
.fb{margin-top:16px;border-radius:18px;padding:14px 18px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--okbg);color:var(--ok);border:2.5px solid var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad);border:2.5px solid var(--bad)}
.fb b{display:block;font-size:1.1em;margin-bottom:2px}
.fb p{color:var(--ink);font-size:.92em}
.fb .ref{display:block;margin-top:6px;color:var(--sub);font-size:.82em}
.nav{margin-top:18px;display:flex;justify-content:flex-start}
.score{font-size:3.2em;line-height:1.2;color:var(--pri);margin:4px 0}
.res li{list-style:none;display:flex;gap:10px;align-items:baseline;border-top:2px solid var(--line);padding:8px 0;font-size:.9em}
.res li:first-child{border-top:0}
.tag{flex:none;border-radius:999px;padding:0 12px;font-size:.8em}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}
.band{margin-top:16px;background:var(--pri);color:var(--on);border-radius:18px;padding:12px 18px}
.band b{display:block}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
footer{padding:12px 0 6px;text-align:center}
.sig{display:inline-flex;align-items:center;gap:12px;direction:ltr;padding-top:8px;position:relative}
.sig:before{content:"";position:absolute;top:0;left:-10%;right:-10%;height:1.5px;background:linear-gradient(90deg,transparent,var(--sigrule),transparent)}
.sig .nm{font-family:'Pinyon Script','Snell Roundhand',cursive;font-weight:400;font-size:30px;line-height:1;background:linear-gradient(90deg,var(--sig1),var(--sig2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sig .dv{width:1.5px;height:26px;background:var(--sigdv)}
.sig .lb{font-family:'Montserrat',Arial,sans-serif;font-weight:600;font-size:9px;letter-spacing:.2em;line-height:1.35;color:var(--siglb);text-align:left}
@media(max-width:560px){.tfgrid{grid-template-columns:1fr 1fr}.wrap{padding:10px 10px 6px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

 <footer><div class="sig"><span class="nm">teacher abdullah</span><span class="dv"></span><span class="lb">DESIGN<br>&amp; PROGRAMMING</span></div></footer>
</div>
<script>
const DATA = {"lesson": "المناطق الرملية", "unit": "الدرس الثالث عشر — الوحدة الرابعة (جغرافية وطني)", "qs": [{"t": "mc", "q": "تغطي المناطق الرملية في وطني نحو:", "opts": ["ثلث مساحته", "نصف مساحته", "ربع مساحته"], "why": "في وطني مناطق رملية واسعة تغطي نحو ثلث مساحته.", "ref": "ص ٧٣", "fixed": false, "a": 0}, {"t": "mc", "q": "نشأت الرمال العظيمة في وطني منذ أكثر من:", "opts": ["١٧ ألف سنة", "١٧٠ سنة", "١٧٠٠ سنة"], "why": "نشأت هذه الرمال منذ أكثر من ١٧ ألف سنة.", "ref": "ص ٧٣", "fixed": false, "a": 0}, {"t": "mc", "q": "ساعد على تجميع الرمال:", "opts": ["الرياح", "الأنهار", "الأمطار"], "why": "ساعدت الرياح على تجمّع الرمال.", "ref": "ص ٧٣", "fixed": false, "a": 0}, {"t": "mc", "q": "أكبر الصحاري الرملية في العالم، ويقع جنوب المملكة العربية السعودية:", "opts": ["الربع الخالي", "الدهناء", "النفود الكبير"], "why": "رمال الربع الخالي تقع جنوب المملكة، وتعد من أكبر الصحاري الرملية في العالم.", "ref": "ص ٧٣", "fixed": false, "a": 0}, {"t": "mc", "q": "بدأت شركة أرامكو السعودية استخراج النفط من حقل الشيبة في الربع الخالي عام:", "opts": ["١٤١٩هـ", "١٣١٩هـ", "١٢٤٠هـ"], "why": "من إنجازات وطني استخراج النفط من حقل الشيبة الذي بدأت فيه أرامكو السعودية عام ١٤١٩هـ.", "ref": "ص ٧٤", "fixed": false, "a": 0}, {"t": "mc", "q": "منطقة رملية على شكل مثلث تغطي أجزاء كبيرة من نجد، وتمتد شمالًا:", "opts": ["النفود الكبير", "الدهناء", "الربع الخالي"], "why": "النفود الكبير منطقة رملية على شكل مثلث تغطي أجزاء كبيرة من نجد وتمتد شمالًا.", "ref": "ص ٧٤", "fixed": false, "a": 0}, {"t": "mc", "q": "رمال تمتد على شكل قوس، تصل بين النفود الكبير والربع الخالي:", "opts": ["الدهناء", "حرة خيبر", "هضبة الصمّان"], "why": "رمال الدهناء تمتد على شكل قوس تصل بين النفود الكبير في الشمال والربع الخالي.", "ref": "ص ٧٥", "fixed": false, "a": 0}, {"t": "mc", "q": "تمثل رمال الدهناء الجزء ........ من المناطق الرملية في وطني:", "opts": ["الأوسط", "الشمالي", "الجنوبي"], "why": "الدهناء تمثل الجزء الأوسط من المناطق الرملية في المملكة.", "ref": "ص ٧٥", "fixed": false, "a": 0}, {"t": "mc", "q": "وُجدت في صحراء النفود الأحافير، وهي بقايا مخلوقات حيوانية ونباتية حُفظت في الطبقات الرسوبية.", "opts": ["صح", "خطأ"], "a": 0, "why": "صحيح؛ وُجدت في صحراء النفود الأحافير، وهي بقايا المخلوقات الحيوانية والنباتية.", "ref": "ص ٧٥", "fixed": true}, {"t": "cls", "q": "صنّف كل سبب من أسباب التصحّر: مناخي أم بشري؟", "cats": ["سبب مناخي", "سبب بشري"], "items": [{"x": "قلة الأمطار", "a": 0, "why": "قلة الأمطار من تغيّر المناخ، فهي سبب مناخي."}, {"x": "قطع الأشجار والنباتات", "a": 1, "why": "قطع الأشجار من فعل الإنسان، فهو سبب بشري."}, {"x": "ارتفاع درجة الحرارة", "a": 0, "why": "ارتفاع درجة الحرارة سبب مناخي للتصحّر."}, {"x": "الرعي الجائر للإبل والأغنام", "a": 1, "why": "الرعي الجائر من فعل الإنسان، فهو سبب بشري."}], "ref": "ص ٧٣"}]};
const $ = s => document.querySelector(s);
const AR = n => String(n).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const app = $('#app');
let i = 0, results = [], student = '', order = [];

function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}
function el(h){const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;}

function intro(){
  i=0;results=[];
  app.innerHTML='';
  const c=el(`<section class="card">
   <h1>ورقة عمل: ${DATA.lesson}</h1>
   <p class="lead">${DATA.unit}</p>
   <div class="chips"><span class="chip">${AR(DATA.qs.length)} أسئلة</span><span class="chip">تصحيح فوري</span><span class="chip">بلا تسجيل دخول</span></div>
   <label for="nm">اكتب اسمك (اختياري)</label>
   <input id="nm" type="text" autocomplete="off" maxlength="40" placeholder="اسمك هنا">
   <p class="lead">أجب عن كل سؤال، وإذا أخطأت ستظهر لك ملاحظة تساعدك على فهم الصواب.</p>
   <button class="btn" id="go">ابدأ الحل</button>
  </section>`);
  app.appendChild(c);
  $('#go').onclick=()=>{student=($('#nm').value||'').trim();i=0;show();};
}

function head(){
  const n=DATA.qs.length;
  return `<div class="prog"><span>السؤال ${AR(i+1)} من ${AR(n)}</span><div class="bar"><i style="width:${(i/n)*100}%"></i></div></div>`;
}

function show(){
  const q=DATA.qs[i];
  app.innerHTML='';
  window.scrollTo(0,0);
  const c=el(`<section class="card">${head()}<div class="q">${q.q}</div><div id="body"></div><div class="fb" id="fb"></div><div class="nav"><button class="btn" id="next" style="display:none">${i==DATA.qs.length-1?'اعرض النتيجة':'السؤال التالي'}</button></div></section>`);
  app.appendChild(c);
  q.t==='mc'?renderMC(q):renderCLS(q);
  $('#next').onclick=()=>{i++;i<DATA.qs.length?show():finish();};
}

function feedback(ok,title,body,ref){
  const f=$('#fb');
  f.className='fb show '+(ok?'ok':'bad');
  f.innerHTML=`<b>${title}</b>${body?`<p>${body}</p>`:''}<span class="ref">المرجع: كتاب الطالب، ${ref}</span>`;
  $('#next').style.display='inline-block';
  $('#next').focus({preventScroll:true});
}

function renderMC(q){
  const idx=q.opts.map((_,k)=>k);
  const seq=q.fixed?idx:shuffle(idx);
  const body=$('#body');
  const grid=el(`<div class="opts ${q.fixed?'tfgrid':''}"></div>`);
  body.appendChild(grid);
  seq.forEach(k=>{
    const b=el(`<button class="opt" type="button">${q.opts[k]}</button>`);
    b.onclick=()=>{
      grid.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      const ok=(k===q.a);
      b.classList.add(ok?'ok':'bad');
      if(!ok){[...grid.children].forEach((x,p)=>{if(seq[p]===q.a)x.classList.add('ok');});}
      results[i]=ok;
      feedback(ok, ok?'أحسنت! إجابة صحيحة.':'ليست هذه الإجابة الصحيحة. راجع معنا:', q.why, q.ref);
    };
    grid.appendChild(b);
  });
}

function renderCLS(q){
  const body=$('#body');
  const ans=q.items.map(()=>-1);
  const rows=q.items.map((it,r)=>{
    const row=el(`<div class="row"><div class="x">${it.x}</div><div class="cs"></div><div class="why">${it.why}</div></div>`);
    q.cats.forEach((cn,ci)=>{
      const b=el(`<button class="cb" type="button">${cn}</button>`);
      b.onclick=()=>{ if(row.dataset.lock)return; ans[r]=ci; row.querySelectorAll('.cb').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); chk.disabled=ans.includes(-1); };
      row.querySelector('.cs').appendChild(b);
    });
    body.appendChild(row);
    return row;
  });
  const chk=el(`<button class="btn" type="button" disabled>تحقّق من إجاباتي</button>`);
  body.appendChild(chk);
  chk.onclick=()=>{
    let all=true;
    rows.forEach((row,r)=>{
      row.dataset.lock='1';
      const ok=ans[r]===q.items[r].a; if(!ok)all=false;
      row.classList.add(ok?'ok':'bad');
      const bs=row.querySelectorAll('.cb');
      bs.forEach((b,ci)=>{b.disabled=true;b.classList.remove('sel'); if(ci===q.items[r].a)b.classList.add('ok'); else if(ci===ans[r])b.classList.add('bad');});
    });
    chk.style.display='none';
    results[i]=all;
    feedback(all, all?'أحسنت! جميع الإجابات صحيحة.':'بعض الإجابات تحتاج إلى مراجعة. اقرأ التعليل تحت كل عبارة خاطئة.', '', q.ref);
  };
}

function finish(){
  const n=DATA.qs.length, s=results.filter(Boolean).length;
  const nm=student?` يا ${student}`:'';
  let msg='', tip='';
  if(s===n){msg='ممتاز'+nm+'! أتقنت الدرس.';tip='أخبر معلّمك بنتيجتك، وشارك زملاءك ما تعلّمته.';}
  else if(s>=Math.ceil(n*0.7)){msg='جيد جدًا'+nm+'!';tip='راجع الأسئلة التي أخطأت فيها في الكتاب ثم أعد المحاولة.';}
  else{msg='بداية جيدة'+nm+'.';tip='اقرأ الدرس من الكتاب مرة أخرى، ثم أعد المحاولة وستتحسن نتيجتك.';}
  const list=DATA.qs.map((q,k)=>`<li><span class="tag ${results[k]?'ok':'bad'}">${results[k]?'صحيحة':'تحتاج مراجعة'}</span><span>${AR(k+1)}) ${q.q}${results[k]?'':` <span style="color:var(--sub)">(راجع ${q.ref})</span>`}</span></li>`).join('');
  app.innerHTML='';
  app.appendChild(el(`<section class="card res"><h1>${msg}</h1><div class="score">${AR(s)} من ${AR(n)}</div><ul>${list}</ul><div class="band"><b>اقتراحي للمراجعة</b>${tip}</div><div class="btns"><button class="btn" id="again">أعد المحاولة</button></div></section>`));
  window.scrollTo(0,0);
  $('#again').onclick=intro;
}
intro();
</script>
</body>
